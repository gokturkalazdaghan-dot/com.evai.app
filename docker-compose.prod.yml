# docker-compose.prod.yml
#
# Uretim ortusu. Kullanimi:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NEDEN AYRI DOSYA
# ----------------
# docker-compose.yml gelistirme icin ayarli ve icinde uretimde TEHLIKELI
# olan varsayilanlar var: sabit veritabani parolasi, disariya acik
# veritabani portu, kapali cihaz dogrulamasi, her kokene acik CORS.
# Tek dosyayi "hem gelistirme hem uretim" yapmaya calismak, birinin
# digerinin ayarlariyla calismasi riskini surekli tasir.
#
# Buradaki her deger ${...} ile ZORUNLU kilinmistir (":-varsayilan" YOK):
# eksik bir sir, sessizce zayif bir varsayilanla degil, ACIK bir hatayla
# sonuclanir.

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER gerekli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB gerekli}
    # Veritabani DISARIYA ACILMAZ. Gelistirmede 5432 acik cunku psql ile
    # baglanmak pratik; uretimde ayni port, internete acik bir saldiri
    # yuzeyidir. Servisler birbirine ic ag uzerinden erisir.
    #
    # !reset SART: Compose port listelerini BIRLESTIRIR. Sadece "ports: []"
    # yazmak temel dosyadaki 5432'yi KALDIRMAZ -- olculdu, port acik
    # kaliyordu.
    ports: !reset []
    volumes:
      - eva_postgres_data:/var/lib/postgresql/data
      # Sema YALNIZCA ilk olusturmada calisir. Uretimde migration'lar elle
      # ve gozden gecirilerek uygulanir (bkz. database/migrations).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  redis:
    ports: !reset []
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}
      --appendonly yes

  gateway:
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # Cihaz dogrulamasi UretimDE ACIK. Kapali oldugunda imzali istek
      # gonderebilen herkes API'yi kullanabilir.
      DEVICE_ATTESTATION_ENFORCED: "true"

      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY gerekli}
      APPLE_APP_BUNDLE_ID: com.evai.app
      ANDROID_PACKAGE_NAME: com.evai.app

      REVENUECAT_WEBHOOK_AUTH_SECRET: ${REVENUECAT_WEBHOOK_AUTH_SECRET:?webhook secret gerekli}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      PRICE_AGENT_SERVICE_URL: http://price-saving-agent:8000
      INTERNAL_SERVICE_MASTER_SECRET: ${INTERNAL_SERVICE_MASTER_SECRET:?ic servis siri gerekli}

      # CORS: "*" DEGIL. Telemetri paneli disinda hicbir koken
      # WebSocket/HTTP ile baglanamamali.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?izinli kokenler gerekli}
      TELEMETRY_PANEL_ORIGIN: ${TELEMETRY_PANEL_ORIGIN:-}

      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}

      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY:-}

    # Gateway'e DISARIDAN dogrudan erisilmez; onunde Caddy durur ve TLS'i
    # o sonlandirir. Port acmak, HTTPS'i atlayan bir yol birakmak olurdu.
    ports: !reset []
    networks:
      - eva-network
    deploy:
      resources:
        limits:
          memory: 512M

  price-saving-agent:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      INTERNAL_SERVICE_MASTER_SECRET: ${INTERNAL_SERVICE_MASTER_SECRET:?ic servis siri gerekli}
      OPENCHARGEMAP_API_KEY: ${OPENCHARGEMAP_API_KEY:?OCM anahtari gerekli}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G

  # ------------------------------------------------------------
  # Caddy: otomatik HTTPS
  # ------------------------------------------------------------
  # Let's Encrypt sertifikasini kendisi alir ve 90 gunde bir kendisi
  # yeniler. Elle sertifika yonetimi, yenilemenin unutuldugu gun tum
  # kullanicilarin baglanamamasi demektir.
  caddy:
    image: caddy:2-alpine
    container_name: eva-caddy
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      EVA_DOMAIN: ${EVA_DOMAIN:?alan adi gerekli}
      # Sertifika uyarilari (yakinda dolacak, yenilenemedi) buraya gider.
      ACME_EMAIL: ${ACME_EMAIL:?ACME e-postasi gerekli}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikalar KALICI olmali; her yeniden baslatmada yeniden almak
      # Let's Encrypt hiz sinirina takilir ve servis sertifikasiz kalir.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - eva-network

volumes:
  caddy_data:
  caddy_config:
