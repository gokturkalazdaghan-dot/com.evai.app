; backend/ai-services/price_saving_agent/mypy.ini
;
; NEDEN VAR
; ---------
; CI `mypy . --ignore-missing-imports` calistiriyordu ve yapilandirma
; olmadigi icin pydantic'i anlamiyordu: Settings() cagrisini "zorunlu
; argumanlar eksik" diye 5 kez hata veriyordu. Oysa pydantic-settings'te
; degerler ORTAMDAN gelir; elle arguman gecmek zaten yanlis olurdu.
;
; Yanlis pozitif ureten bir tip kontrolu, bir sure sonra herkesin
; gormezden geldigi bir adima doner.

[mypy]
plugins = pydantic.mypy
ignore_missing_imports = True
; Kademeli benimseme: bu kod tabani bastan tipli yazilmadi. Amac su an
; "her sey tipli olsun" degil, GERCEK tip hatalarini yakalamak.
check_untyped_defs = True
warn_unused_ignores = True

[pydantic-mypy]
; Settings alanlari ortamdan dolduruldugu icin __init__ argumanlarini
; zorunlu saymaz.
init_forbid_extra = False
init_typed = False
