# .github/workflows/gateway-ci.yml
name: Gateway CI

on:
  pull_request:
    paths:
      - 'backend/nestjs-gateway/**'
      - '.github/workflows/gateway-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/nestjs-gateway/**'

defaults:
  run:
    working-directory: backend/nestjs-gateway

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/nestjs-gateway/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: eva_test_password
          POSTGRES_DB: eva_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:eva_test_password@localhost:5432/eva_test
      REDIS_URL: redis://localhost:6379
      DEVICE_ATTESTATION_ENFORCED: "false"
      ADMIN_API_KEY: test_admin_key_minimum_32_characters_long
      REVENUECAT_WEBHOOK_AUTH_SECRET: test_revenuecat_secret_min_24_chars
      APPLE_APP_BUNDLE_ID: com.evai.app
      ANDROID_PACKAGE_NAME: com.evai.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/nestjs-gateway/package-lock.json
      - run: npm install
      - name: Load PostGIS schema
        run: |
          PGPASSWORD=eva_test_password psql -h localhost -U postgres -d eva_test \
            -f ../../database/schema.sql
      - run: npm run test -- --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: gateway-coverage
          path: backend/nestjs-gateway/coverage/

  build-docker-image:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/nestjs-gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
            ghcr.io/${{ github.repository }}/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
