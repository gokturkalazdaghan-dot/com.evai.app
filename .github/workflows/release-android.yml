# .github/workflows/release-android.yml
name: Android Release

on:
  push:
    tags:
      - 'android-v*.*.*'

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create CI local.properties (release keys production job'da eklenir)
        run: |
          cat > local.properties << 'EOF'
          sdk.dir=${ANDROID_HOME}
          EOF
      - run: ./gradlew testReleaseUnitTest
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/android-v}"
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}

  release-to-play-store:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Bu job, GitHub Environment protection rules sayesinde bir insan
    # onayı olmadan ÇALIŞMAZ. "production-release" environment'ı için
    # Settings → Environments altında tanımlı reviewer onay verene kadar
    # burada bekler.
    environment:
      name: production-release
      url: https://play.google.com/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: fastlane/android

      # Sunucu adresi ve Maps anahtarı APK'nın İÇİNE derlenir; yanlış
      # değerle üretilen bir sürüm Play'e yüklendikten sonra geri
      # alınamaz. Bu yüzden derlemeden ÖNCE doğrulanıyorlar.
      #
      # Adres neden sabit yazılamaz: burada bir zamanlar
      # `https://api.evaapp.com` sabiti duruyordu — BİZE AİT OLMAYAN bir
      # alan adı. O haliyle üretilen bir sürüm, kullanıcıların imzalı
      # isteklerini (cihaz kimliği + konum) o alan adının sahibine
      # gönderirdi ve karşı taraf istediği fiyatı döndürebilirdi. Aynı
      # hata build.gradle.kts tarafında düzeltilmişti ama bu workflow
      # atlanmıştı.
      - name: Verify release secrets are configured
        env:
          EVA_GATEWAY_BASE_URL_RELEASE: ${{ secrets.EVA_GATEWAY_BASE_URL_RELEASE }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          REVENUECAT_PUBLIC_API_KEY: ${{ secrets.REVENUECAT_PUBLIC_API_KEY }}
        run: |
          fail=0
          require() {
            if [ -z "$2" ]; then
              echo "::error::$1 secret'ı tanımlı değil — üretim sürümü bu değer olmadan derlenemez."
              fail=1
            fi
          }
          require EVA_GATEWAY_BASE_URL_RELEASE "$EVA_GATEWAY_BASE_URL_RELEASE"
          require MAPS_API_KEY "$MAPS_API_KEY"
          require REVENUECAT_PUBLIC_API_KEY "$REVENUECAT_PUBLIC_API_KEY"

          case "$EVA_GATEWAY_BASE_URL_RELEASE" in
            https://*) ;;
            "") ;;
            *)
              echo "::error::EVA_GATEWAY_BASE_URL_RELEASE https:// ile başlamalı."
              fail=1
              ;;
          esac

          exit $fail

      - name: Create local.properties with real RevenueCat/Gateway values
        env:
          REVENUECAT_PUBLIC_API_KEY: ${{ secrets.REVENUECAT_PUBLIC_API_KEY }}
          GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
          EVA_GATEWAY_BASE_URL_RELEASE: ${{ secrets.EVA_GATEWAY_BASE_URL_RELEASE }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          cat > local.properties << EOF
          sdk.dir=${ANDROID_HOME}
          REVENUECAT_PUBLIC_API_KEY=${REVENUECAT_PUBLIC_API_KEY}
          MAPS_API_KEY=${MAPS_API_KEY}
          EVA_GATEWAY_BASE_URL_DEBUG=http://10.0.2.2:3000
          EVA_GATEWAY_BASE_URL_RELEASE=${EVA_GATEWAY_BASE_URL_RELEASE}
          GOOGLE_CLOUD_PROJECT_NUMBER=${GOOGLE_CLOUD_PROJECT_NUMBER}
          EOF

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
        working-directory: android/app

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Decode Play Console service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_CONSOLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON" > ../fastlane/android/play-service-account.json

      - name: Upload to Play Console (internal testing track)
        working-directory: fastlane/android
        run: bundle exec fastlane android deploy_internal

      - name: Clean up secrets from disk
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f fastlane/android/play-service-account.json
          rm -f android/local.properties

      - uses: actions/upload-artifact@v4
        with:
          name: eva-release-aab-${{ needs.build-and-test.outputs.version_name }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
