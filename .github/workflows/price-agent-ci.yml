# .github/workflows/price-agent-ci.yml
name: Price Saving Agent CI

on:
  pull_request:
    paths:
      - 'backend/ai-services/price_saving_agent/**'
      - '.github/workflows/price-agent-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/ai-services/price_saving_agent/**'

defaults:
  run:
    working-directory: backend/ai-services/price_saving_agent

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff mypy
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy . --ignore-missing-imports

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: eva_test_password
          POSTGRES_DB: eva_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # CrewAI ajanları CI'da gerçek Anthropic API'ye ÇAĞRI YAPMAZ — test
      # suite'i tool fonksiyonlarını (tariff_fetch_tool, postgres_write_tool,
      # anonymizer) izole birim testleriyle kapsar. Gerçek API key CI'da
      # kullanılmıyor.
      POSTGRES_DSN: postgresql://postgres:eva_test_password@localhost:5432/eva_test
      REDIS_URL: redis://localhost:6379
      OCPI_AGGREGATOR_BASE_URL: http://localhost:9999
      OCPI_AGGREGATOR_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov respx
      - name: Load PostGIS schema
        run: |
          PGPASSWORD=eva_test_password psql -h localhost -U postgres -d eva_test \
            -f ../../../database/schema.sql
      - name: Start mock CPO aggregator
        working-directory: backend/ai-services/mock_cpo_aggregator
        run: |
          pip install -r requirements.txt
          nohup uvicorn main:app --host 0.0.0.0 --port 9999 &
          sleep 2
          curl -sf http://localhost:9999/health
      - name: Run tests
        run: pytest --cov=. --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: price-agent-coverage
          path: backend/ai-services/price_saving_agent/coverage.xml

  build-docker-image:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/ai-services/price_saving_agent
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/price-saving-agent:${{ github.sha }}
            ghcr.io/${{ github.repository }}/price-saving-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
