# .github/workflows/mobile-android-ci.yml
name: Android CI

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/mobile-android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'

defaults:
  run:
    working-directory: android

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # CI'da gerçek RevenueCat/GCP anahtarları yok — lint ve unit test
      # aşaması için placeholder değerler yeterli (BuildConfig alanları
      # doldurulmalı, aksi halde derleme başarısız olur; gerçek anahtarlar
      # yalnızca release workflow'unda, imzalı build üretilirken gerekir).
      - name: Create CI local.properties
        run: |
          cat > local.properties << 'EOF'
          sdk.dir=${ANDROID_HOME}
          REVENUECAT_PUBLIC_API_KEY=goog_ci_placeholder_not_functional
          EVA_GATEWAY_BASE_URL_DEBUG=http://10.0.2.2:3000
          # Bu iş yalnızca debug derliyor; release adresi hiç kullanılmaz.
          # Yine de BİZE AİT OLMAYAN gerçek bir alan adı yazmıyoruz —
          # yer tutucu olduğu ilk bakışta anlaşılmalı, yoksa birileri onu
          # geçerli yapılandırma sanıp kopyalayabilir.
          EVA_GATEWAY_BASE_URL_RELEASE=https://ci-placeholder.invalid
          GOOGLE_CLOUD_PROJECT_NUMBER=0
          EOF

      - run: ./gradlew lint
      - run: ./gradlew testDebugUnitTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/reports/tests/

  build-debug-apk:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create CI local.properties
        run: |
          cat > local.properties << 'EOF'
          sdk.dir=${ANDROID_HOME}
          REVENUECAT_PUBLIC_API_KEY=goog_ci_placeholder_not_functional
          EVA_GATEWAY_BASE_URL_DEBUG=http://10.0.2.2:3000
          # Bu iş yalnızca debug derliyor; release adresi hiç kullanılmaz.
          # Yine de BİZE AİT OLMAYAN gerçek bir alan adı yazmıyoruz —
          # yer tutucu olduğu ilk bakışta anlaşılmalı, yoksa birileri onu
          # geçerli yapılandırma sanıp kopyalayabilir.
          EVA_GATEWAY_BASE_URL_RELEASE=https://ci-placeholder.invalid
          GOOGLE_CLOUD_PROJECT_NUMBER=0
          EOF
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: eva-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  # Play Store'a otomatik yayın kasıtlı olarak eklenmedi — imza anahtarları
  # (keystore) ve Play Console service account'un CI secret'larına
  # eklenmesini gerektiren, ayrı bir güvenlik incelemesi gerektiren adım.
  # Bkz. release-android.yml.
